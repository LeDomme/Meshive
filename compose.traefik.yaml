# HTTPS deployment behind an existing Traefik reverse proxy.
services:
  meshive:
    image: ${MESHIVE_IMAGE:-ghcr.io/ledomme/meshive:1.6.3}
    container_name: meshive
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      MESHIVE_FIX_PERMISSIONS: ${MESHIVE_FIX_PERMISSIONS:-auto}
      MESHIVE_ENVIRONMENT: production
      MESHIVE_SETUP_TOKEN: ${MESHIVE_SETUP_TOKEN:-}
    volumes:
      - meshive-data:/app/data
      - meshive-cache:/app/cache
      - meshive-backups:/backups
      - meshive-models:/models:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETUID
      - SETGID
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.meshive.rule: Host(`${MESHIVE_HOST:-meshive.example.invalid}`)
      traefik.http.routers.meshive.entrypoints: ${TRAEFIK_ENTRYPOINTS:-websecure}
      traefik.http.routers.meshive.tls: "true"
      traefik.http.routers.meshive.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.meshive.loadbalancer.server.port: "8000"

volumes:
  meshive-data:
  meshive-cache:
  meshive-backups:
    external: true
    name: ${MESHIVE_BACKUP_VOLUME:-meshive-backups}
  meshive-models:
    external: true
    name: ${MESHIVE_MODELS_VOLUME:-meshive-models}

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
