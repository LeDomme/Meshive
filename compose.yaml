# Standalone deployment with a directly published HTTP port. Use only on a
# trusted network or for evaluation; use compose.traefik.yaml for HTTPS.
services:
  meshive:
    image: ${MESHIVE_IMAGE:-ghcr.io/ledomme/meshive:1.6.2}
    container_name: meshive
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      MESHIVE_ENVIRONMENT: ${MESHIVE_ENVIRONMENT:-development}
      MESHIVE_SETUP_TOKEN: ${MESHIVE_SETUP_TOKEN:-}
    ports:
      - ${MESHIVE_PORT:-8000}:8000
    volumes:
      - meshive-data:/app/data
      - meshive-cache:/app/cache
      - meshive-backups:/backups
      - meshive-models:/models:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETUID
      - SETGID

volumes:
  meshive-data:
  meshive-cache:
  meshive-backups:
    external: true
    name: ${MESHIVE_BACKUP_VOLUME:-meshive-backups}
  meshive-models:
    external: true
    name: ${MESHIVE_MODELS_VOLUME:-meshive-models}
