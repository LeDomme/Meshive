# Standalone deployment with a directly published HTTP port.
services:
  meshive:
    image: ${MESHIVE_IMAGE:-ghcr.io/ledomme/meshive:1.1.0}
    container_name: meshive
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      MESHIVE_ENVIRONMENT: ${MESHIVE_ENVIRONMENT:-development}
      MESHIVE_DATA_DIR: /app/data
      MESHIVE_CACHE_DIR: /app/cache
      MESHIVE_BACKUP_DIR: /backups
      MESHIVE_FRONTEND_DIST: /app/frontend
      MESHIVE_ALLOWED_LIBRARY_ROOT: /models
      MESHIVE_SESSION_COOKIE_NAME: ${MESHIVE_SESSION_COOKIE_NAME:-meshive_session}
      MESHIVE_SESSION_LIFETIME_DAYS: ${MESHIVE_SESSION_LIFETIME_DAYS:-7}
      MESHIVE_AUTH_RATE_LIMIT_ATTEMPTS: ${MESHIVE_AUTH_RATE_LIMIT_ATTEMPTS:-5}
      MESHIVE_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${MESHIVE_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      MESHIVE_PUBLIC_URL: ${MESHIVE_PUBLIC_URL:-}
      MESHIVE_SMTP_HOST: ${MESHIVE_SMTP_HOST:-}
      MESHIVE_SMTP_PORT: ${MESHIVE_SMTP_PORT:-587}
      MESHIVE_SMTP_USERNAME: ${MESHIVE_SMTP_USERNAME:-}
      MESHIVE_SMTP_PASSWORD: ${MESHIVE_SMTP_PASSWORD:-}
      MESHIVE_SMTP_FROM: ${MESHIVE_SMTP_FROM:-}
      MESHIVE_SMTP_SECURITY: ${MESHIVE_SMTP_SECURITY:-starttls}
      MESHIVE_SMTP_TIMEOUT_SECONDS: ${MESHIVE_SMTP_TIMEOUT_SECONDS:-15}
      MESHIVE_PASSWORD_RESET_LIFETIME_MINUTES: ${MESHIVE_PASSWORD_RESET_LIFETIME_MINUTES:-30}
      MESHIVE_EMAIL_VERIFICATION_LIFETIME_HOURS: ${MESHIVE_EMAIL_VERIFICATION_LIFETIME_HOURS:-24}
      MESHIVE_ARCHIVE_COMMAND: ${MESHIVE_ARCHIVE_COMMAND:-7z}
      MESHIVE_ARCHIVE_TIMEOUT_SECONDS: ${MESHIVE_ARCHIVE_TIMEOUT_SECONDS:-120}
      MESHIVE_ARCHIVE_MAX_ENTRIES: ${MESHIVE_ARCHIVE_MAX_ENTRIES:-100000}
      MESHIVE_ARCHIVE_MAX_OUTPUT_BYTES: ${MESHIVE_ARCHIVE_MAX_OUTPUT_BYTES:-67108864}
      MESHIVE_BACKUP_MAX_RESTORE_BYTES: ${MESHIVE_BACKUP_MAX_RESTORE_BYTES:-5368709120}
      MESHIVE_BACKUP_RESTORE_MIN_FREE_BYTES: ${MESHIVE_BACKUP_RESTORE_MIN_FREE_BYTES:-67108864}
      MESHIVE_MAX_CONCURRENT_SCANS: ${MESHIVE_MAX_CONCURRENT_SCANS:-1}
      MESHIVE_MAX_CONCURRENT_DOWNLOADS: ${MESHIVE_MAX_CONCURRENT_DOWNLOADS:-4}
      MESHIVE_THUMBNAIL_SIZE: ${MESHIVE_THUMBNAIL_SIZE:-480}
      MESHIVE_THUMBNAIL_QUALITY: ${MESHIVE_THUMBNAIL_QUALITY:-82}
      MESHIVE_THUMBNAIL_MAX_BYTES: ${MESHIVE_THUMBNAIL_MAX_BYTES:-65536}
      MESHIVE_ARCHIVE_IMAGE_DETAIL_SIZE: ${MESHIVE_ARCHIVE_IMAGE_DETAIL_SIZE:-1600}
      MESHIVE_ARCHIVE_IMAGE_DETAIL_MAX_BYTES: ${MESHIVE_ARCHIVE_IMAGE_DETAIL_MAX_BYTES:-393216}
      MESHIVE_SETUP_TOKEN: ${MESHIVE_SETUP_TOKEN:-}
    ports:
      - ${MESHIVE_PORT:-8000}:8000
    volumes:
      - meshive-data:/app/data
      - meshive-cache:/app/cache
      - meshive-backups:/backups
      - meshive-models:/models:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID

volumes:
  meshive-data:
  meshive-cache:
  meshive-backups:
    external: true
    name: ${MESHIVE_BACKUP_VOLUME:-meshive-backups}
  meshive-models:
    external: true
    name: ${MESHIVE_MODELS_VOLUME:-meshive-models}
